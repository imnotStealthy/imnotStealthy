  <style>.display{font-family:Impact,Haettenschweiler,"Arial Black","DejaVu Sans Condensed",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.o{stroke:#fff;stroke-width:5;stroke-linejoin:miter}.label{font-size:17px;font-weight:800;letter-spacing:.8px}.small{font-size:14px;font-weight:700;letter-spacing:.6px}</style>
  <rect width="600" height="520" fill="#000"/><rect x="30" y="30" width="540" height="450" fill="#000"/><rect x="18" y="18" width="540" height="450" fill="#0b0b0b" class="o"/>
  <rect x="18" y="18" width="540" height="48" fill="#fff" class="o"/><text x="38" y="49" class="mono small" fill="#000">PROFILE://STEALTHY</text>
  <text x="40" y="130" class="display" font-size="72" letter-spacing="-2" fill="#fff">STEALTHY</text><text x="42" y="157" class="mono small" fill="#fff">AUTOMATION / AGENTS / MCP</text>
  <rect x="40" y="182" width="496" height="82" fill="#000" class="o"/><text x="62" y="215" class="mono small" fill="#fff">CONTROL_ROOM.exe</text><text x="62" y="239" class="mono small" fill="#fff">&gt; route noise --to signal</text><text x="62" y="261" class="mono small" fill="#fff">[OK] quiet tools online</text>
  <g class="mono"><rect x="40" y="294" width="226" height="44" fill="#0b0b0b" class="o"/><text x="119" y="322" class="mono label" fill="#fff">INPUT</text><rect x="310" y="294" width="226" height="44" fill="#0b0b0b" class="o"/><text x="355" y="322" class="mono label" fill="#fff">AGENTS + MCP</text><rect x="40" y="360" width="226" height="44" fill="#0b0b0b" class="o"/><text x="116" y="388" class="mono label" fill="#fff">TOOLS</text><rect x="310" y="360" width="226" height="44" fill="#fff" class="o"/><text x="386" y="388" class="mono label" fill="#000">PROOF</text></g>
  <text x="40" y="440" class="mono small" fill="#fff">QUIET SYSTEMS / CLEAR SIGNAL</text>
