<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title description">
  <title id="title">Stealthy Control Room</title>
  <desc id="description">Mobile neo-brutalist banner for Stealthy, showing a pipeline from messy inputs to clear signals.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#111111" opacity="0.16" />
    </pattern>
    <style>
      .display { font-family: Impact, Haettenschweiler, "Arial Black", "DejaVu Sans Condensed", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .ink { fill: #111111; }
      .outline { stroke: #111111; stroke-width: 6; stroke-linejoin: miter; }
      .label { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
      .small { font-size: 20px; font-weight: 800; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="800" height="720" fill="#FFF7E8" />
  <rect width="800" height="720" fill="url(#dots)" />
  <rect x="28" y="28" width="748" height="668" fill="#111111" />
