<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 830" role="img" aria-labelledby="title description">
  <title id="title">Stealthy project switchboard</title><desc id="description">Mobile project switchboard linking six tool families to a local-first Stealthy core.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#111" opacity=".13"/></pattern></defs><style>.display{font-family:Impact,Haettenschweiler,"Arial Black","DejaVu Sans Condensed",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.o{stroke:#111;stroke-width:6;stroke-linejoin:miter}.h{font-size:27px;font-weight:900}.s{font-size:20px;font-weight:800}</style>
  <rect width="600" height="830" fill="#FFF7E8"/><rect width="600" height="830" fill="url(#grid)"/><rect x="27" y="27" width="552" height="782" fill="#111"/><rect x="16" y="16" width="552" height="782" fill="#FFF7E8" class="o"/><rect x="16" y="16" width="552" height="56" fill="#111"/><text x="38" y="53" class="mono h" fill="#FFF7E8">PROJECT SWITCHBOARD</text><circle cx="530" cy="43" r="10" fill="#A8FF60" stroke="#FFF7E8" stroke-width="4"/>
  <path d="M300 214v513M178 269h244M178 459h244M178 649h244" fill="none" stroke="#111" stroke-width="9"/>
  <g id="core"><rect x="66" y="104" width="468" height="110" fill="#111"/><rect x="54" y="92" width="468" height="110" fill="#A8FF60" class="o"/><text x="119" y="146" class="display" font-size="52">STEALTHY CORE</text><text x="112" y="179" class="mono s">LOCAL-FIRST / HUMAN-IN-THE-LOOP</text></g>
  <g class="mono"><rect x="42" y="252" width="252" height="112" fill="#FFD84D" class="o"/><text x="59" y="291" class="h">OBSERVE</text><text x="59" y="329" class="s">tokenscope</text><rect x="306" y="252" width="252" height="112" fill="#FF6B6B" class="o"/><text x="323" y="291" class="h">DATA</text><text x="323" y="329" class="s">powerbi-mcp-local</text></g>
  <g class="mono"><rect x="42" y="442" width="252" height="112" fill="#5BE7FF" class="o"/><text x="59" y="481" class="h">CONNECT</text><text x="59" y="519" class="s">MCP server rack</text><rect x="306" y="442" width="252" height="112" fill="#FF6B6B" class="o"/><text x="323" y="481" class="h">GUARD</text><text x="323" y="519" class="s">remnant + security</text></g>
  <g class="mono"><rect x="42" y="632" width="252" height="112" fill="#5BE7FF" class="o"/><text x="59" y="671" class="h">DESKTOP</text><text x="59" y="706" class="s">claude-rpc</text><text x="59" y="730" class="s">+ codex-rpc</text><rect x="306" y="632" width="252" height="112" fill="#FFD84D" class="o"/><text x="323" y="671" class="h">FIELD LABS</text><text x="323" y="706" class="s">Deadzone + Nihongo</text><text x="323" y="730" class="s">+ pitwall</text></g>
  <text x="42" y="779" class="mono s">6 MODULES // ALL SIGNALS NOMINAL</text>
</svg>
