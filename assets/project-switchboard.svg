<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title description">
  <title id="title">Stealthy project switchboard</title>
  <desc id="description">Project switchboard linking observability, business data, MCP servers, guardrails, desktop tools and field labs around a local-first Stealthy core.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#111111" stroke-width="1" opacity=".13"/></pattern></defs>
  <style>.display{font-family:Impact,Haettenschweiler,"Arial Black","DejaVu Sans Condensed",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.outline{stroke:#111;stroke-width:6;stroke-linejoin:miter}.head{font-size:24px;font-weight:900}.sub{font-size:16px;font-weight:800}</style>
  <rect width="900" height="580" fill="#FFF7E8"/><rect width="900" height="580" fill="url(#grid)"/><rect x="27" y="27" width="852" height="532" fill="#111"/><rect x="16" y="16" width="852" height="532" fill="#FFF7E8" class="outline"/>
  <rect x="16" y="16" width="852" height="54" fill="#111"/><text x="39" y="52" class="mono head" fill="#FFF7E8">PROJECT SWITCHBOARD // PATCHED LIVE</text><circle cx="822" cy="43" r="10" fill="#A8FF60" stroke="#FFF7E8" stroke-width="4"/>
  <g id="cables" fill="none" stroke="#111" stroke-width="8"><path d="M170 181v48h190v43"/><path d="M450 181v91"/><path d="M730 181v48H540v43"/><path d="M170 405v-47h190v-43"/><path d="M450 405v-90"/><path d="M730 405v-47H540v-43"/></g>
  <g id="top-modules" class="mono"><rect x="45" y="94" width="250" height="87" fill="#FFD84D" class="outline"/><text x="62" y="128" class="head">OBSERVE</text><text x="62" y="157" class="sub">tokenscope</text><rect x="325" y="94" width="250" height="87" fill="#FF6B6B" class="outline"/><text x="342" y="128" class="head">DATA</text><text x="342" y="157" class="sub">powerbi-mcp-local</text><rect x="605" y="94" width="250" height="87" fill="#5BE7FF" class="outline"/><text x="622" y="128" class="head">CONNECT</text><text x="622" y="157" class="sub">MCP server rack</text></g>
  <g id="stealthy-core"><rect x="270" y="246" width="360" height="112" fill="#111"/><rect x="258" y="234" width="360" height="112" fill="#A8FF60" class="outline"/><text x="300" y="287" class="display" font-size="45" letter-spacing="1" fill="#111">STEALTHY CORE</text><text x="313" y="321" class="mono sub" fill="#111">LOCAL-FIRST / HUMAN-IN-THE-LOOP</text><circle cx="281" cy="260" r="8" fill="#FF6B6B" stroke="#111" stroke-width="4"/><circle cx="281" cy="288" r="8" fill="#FFD84D" stroke="#111" stroke-width="4"/><circle cx="281" cy="316" r="8" fill="#5BE7FF" stroke="#111" stroke-width="4"/></g>
  <g id="bottom-modules" class="mono"><rect x="45" y="405" width="250" height="99" fill="#FF6B6B" class="outline"/><text x="62" y="441" class="head">GUARD</text><text x="62" y="470" class="sub">remnant + security</text><rect x="325" y="405" width="250" height="99" fill="#5BE7FF" class="outline"/><text x="342" y="441" class="head">DESKTOP</text><text x="342" y="470" class="sub">claude-rpc + codex-rpc</text><rect x="605" y="405" width="250" height="99" fill="#FFD84D" class="outline"/><text x="622" y="441" class="head">FIELD LABS</text><text x="622" y="470" class="sub" style="font-size:14px">Deadzone + Nihongo + pitwall</text></g>
  <text x="45" y="531" class="mono sub" fill="#111">SIGNAL PATH: IDEAS → RULES → TOOLS → PROOF</text><text x="764" y="531" class="mono sub" fill="#111">6/6 OK</text>
</svg>
